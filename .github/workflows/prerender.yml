name: Auto prerender

# Tự chạy prerender khi nội dung thay đổi (admin đẩy data.js lên GitHub)
# -> sinh lại trang tĩnh bài viết/dự án/tuyển dụng + sitemap, cập nhật ?v=<mã băm>
#    của mọi file JS/CSS trên mọi trang, commit ngược vào repo.

on:
  push:
    branches: [main]
    paths:
      - "assets/js/**"
      - "assets/css/**"
      - "tools/prerender.mjs"
      - "tools/careers-render.mjs"
      - "tools/tests/**"

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    # Không tự kích hoạt lại chính nó
    if: "!contains(github.event.head_commit.message, '[prerender]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chạy prerender
        run: node tools/prerender.mjs
      - name: Commit kết quả
        run: |
          git config user.name "paceland-bot"
          git config user.email "bot@paceland.vn"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi"
          else
            git commit -m "[prerender] Tự động sinh trang tĩnh + sitemap"
            git push
          fi
      # Kiểm thử Recruitment System + link nội bộ. Chạy SAU bước commit để
      # nội dung xuất bản từ Admin không bị chặn; test lỗi sẽ báo đỏ trên GitHub.
      - name: Kiểm thử (node --test)
        run: node --test "tools/tests/*.test.mjs"
